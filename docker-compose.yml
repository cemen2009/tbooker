services:
  tbooker:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:app@postgres:5432/tbooker
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: tbooker-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tbooker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tbooker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: